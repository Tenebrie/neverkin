site:
  name: Neverkin
  site: 'https://neverkin.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Neverkin
    template: '%s — Neverkin'
  description: 'An open-source worldbuilding platform for people. Organize your lore, timelines and mindmaps in real-time with friends. Just write something neat.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Neverkin
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

ui:
  theme: 'dark:only'
