server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Where this build's /static tree was published; empty disables the fallback
    set $asset_store_url "${ASSET_STORE_URL}";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hashed build output; hashes this image doesn't have belong to another version of it
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri @store;
    }

    location @store {
        if ($asset_store_url = "") {
            return 404;
        }
        resolver 127.0.0.11 valid=30s;
        proxy_ssl_server_name on;
        proxy_pass $asset_store_url$uri;
    }

    # SPA routing - serve index.html for all routes, always revalidated
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
