version: 2

updates:
  # Root
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      root-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      root-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
    groups:
      root-compose-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      root-compose-major:
        patterns: ['*']
        update-types: ['major']

  # Styx
  - package-ecosystem: 'npm'
    directory: '/app/styx-frontend'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      styx-npm-tiptap:
        patterns: ['@tiptap/*']
      styx-npm-minor-patch:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['minor', 'patch']
      styx-npm-major:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/app/styx-frontend'
    schedule:
      interval: 'weekly'
    groups:
      styx-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      styx-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Rhea
  - package-ecosystem: 'npm'
    directory: '/app/rhea-backend'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      rhea-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      rhea-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/app/rhea-backend'
    schedule:
      interval: 'weekly'
    groups:
      rhea-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      rhea-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Calliope
  - package-ecosystem: 'npm'
    directory: '/app/calliope-websockets'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      calliope-npm-tiptap:
        patterns: ['@tiptap/*']
      calliope-npm-minor-patch:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['minor', 'patch']
      calliope-npm-major:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/app/calliope-websockets'
    schedule:
      interval: 'weekly'
    groups:
      calliope-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      calliope-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Orpheus
  - package-ecosystem: 'npm'
    directory: '/app/orpheus-mcp'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      orpheus-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      orpheus-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/app/orpheus-mcp'
    schedule:
      interval: 'weekly'
    groups:
      orpheus-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      orpheus-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Thetis
  - package-ecosystem: 'npm'
    directory: '/app/thetis-landing'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Starlight bundles against js-yaml 4; a hoisted v5 breaks `astro build`
      - dependency-name: 'js-yaml'
        update-types: ['version-update:semver-major']
      # Astro ecosystem stays on the current major
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrolib/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-*'
        update-types: ['version-update:semver-major']
      # 0.x: minors are its majors, and each tracks an astro major
      - dependency-name: '@astrojs/starlight'
        update-types: ['version-update:semver-minor']
    groups:
      thetis-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      thetis-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/app/thetis-landing'
    schedule:
      interval: 'weekly'
    groups:
      thetis-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      thetis-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Echo
  - package-ecosystem: 'npm'
    directory: '/app/echo-desktop'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      echo-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      echo-npm-major:
        patterns: ['*']
        update-types: ['major']

  # ts-shared
  - package-ecosystem: 'npm'
    directory: '/app/ts-shared'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      ts-shared-npm-tiptap:
        patterns: ['@tiptap/*']
      ts-shared-npm-minor-patch:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['minor', 'patch']
      ts-shared-npm-major:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['major']

  # Libraries
  - package-ecosystem: 'npm'
    directories:
      - '/library/tiptap-schema'
      - '/library/openapi-fetch'
      - '/library/esoteric-date'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      library-npm-tiptap:
        patterns: ['@tiptap/*']
      library-npm-minor-patch:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['minor', 'patch']
      library-npm-major:
        patterns: ['*']
        exclude-patterns: ['@tiptap/*']
        update-types: ['major']

  # Gatekeeper
  - package-ecosystem: 'docker'
    directory: '/app/gatekeeper-proxy'
    schedule:
      interval: 'weekly'
    groups:
      gatekeeper-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      gatekeeper-docker-major:
        patterns: ['*']
        update-types: ['major']

  # Chronos
  - package-ecosystem: 'docker'
    directory: '/app/chronos-backups'
    schedule:
      interval: 'weekly'
    groups:
      chronos-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      chronos-docker-major:
        patterns: ['*']
        update-types: ['major']

  # E2E Tests
  - package-ecosystem: 'npm'
    directory: '/test/e2e'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      e2e-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      e2e-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/test/e2e'
    schedule:
      interval: 'weekly'
    groups:
      e2e-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      e2e-docker-major:
        patterns: ['*']
        update-types: ['major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        patterns: ['*']
        update-types: ['major']
