name: Deploy

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-commits:
    name: Check Commits
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.calc.outputs.count }}
      version: ${{ github.ref_name == 'main' && steps.latest-tag.outputs.tag || steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Commits
        id: calc
        run: |
          COUNT=$(git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"%s" | grep -cE '^(fix|feat|major):' || true)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Get Latest Tag (Production)
        id: latest-tag
        if: ${{ github.ref_name == 'main' }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Version Number (Staging)
        id: version
        if: ${{ github.ref_name == 'dev' }}
        uses: paulhatch/semantic-version@v6.0.3
        with:
          major_pattern: 'major:'
          minor_pattern: 'feat:'
          version_format: 'v${major}.${minor}.${patch}'

  prepare-containers:
    name: Publish Containers
    runs-on: ubuntu-latest
    needs: [check-commits]
    if: ${{ needs.check-commits.outputs.count > 0 || github.ref_name == 'main' }}
    permissions:
      packages: write
      contents: write
    strategy:
      matrix:
        service: [gatekeeper, styx, rhea, calliope, orpheus, chronos, thetis]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check Existing Container
        id: check-container
        run: |
          if docker manifest inspect tenebrie/timelines-${{ matrix.service }}:${{ needs.check-commits.outputs.version }} > /dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check-container.outputs.missing == 'true'
      - uses: crazy-max/ghaction-github-runtime@v4
        if: steps.check-container.outputs.missing == 'true'

      - name: Build & Publish
        if: steps.check-container.outputs.missing == 'true'
        run: |
          docker compose -f docker-compose.common.yml -f docker-compose.prod.yml -f docker-compose.build.yml build ${{ matrix.service }}
          docker push tenebrie/timelines-${{ matrix.service }}:${{ needs.check-commits.outputs.version }}
        env:
          VERSION: ${{ needs.check-commits.outputs.version }}
          COMPOSE_BAKE: true

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check-commits, prepare-containers]
    if: ${{ github.ref_name == 'dev' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Releases are born as prereleases; the production deploy promotes the
      # deployed version to the "latest" release.
      - name: Create a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check-commits.outputs.version }}" \
            --title "Release ${{ needs.check-commits.outputs.version }}" \
            --prerelease --generate-notes

  build-echo:
    name: Build Echo (${{ matrix.name }})
    needs: [check-commits, create-release]
    if: ${{ github.ref_name == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: MacOS
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: Windows
            os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable git symlinks
        run: git config --global core.symlinks true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Run through git bash to avoid messing with cmd.exe
      - name: Use bash for npm scripts
        if: runner.os == 'Windows'
        run: npm config set script-shell bash

      - name: Install dependencies
        run: npm install
        env:
          HUSKY: 0

      - name: Build and package
        run: npm run build
        working-directory: app/echo-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: neverkin-desktop-${{ needs.check-commits.outputs.version }}-${{ matrix.platform }}-x64-artifact
          path: |
            app/echo-desktop/dist/package/*.zip
            app/echo-desktop/dist/package/*.tar.gz
          if-no-files-found: error

  publish-echo:
    name: Publish Echo Builds
    needs: [check-commits, build-echo]
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: neverkin-desktop-*-artifact
          merge-multiple: true

      - name: Upload archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.check-commits.outputs.version }}" artifacts/* --clobber

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [check-commits, prepare-containers, create-release]
    if: ${{ github.ref_name == 'dev' }}
    environment:
      name: staging
      url: https://staging.tenebrie.com/

    steps:
      - uses: actions/checkout@v7

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $(doctl compute droplet get staging-manager-1 --format PublicIPv4 --no-header) >> ~/.ssh/known_hosts

      - name: Checkout branch
        run: doctl compute ssh staging-manager-1 --ssh-command "cd timelines && git fetch && git checkout dev && git pull"

      - name: Backup Database (Backrest)
        run: doctl compute ssh staging-manager-1 --ssh-command "cd timelines && ./scripts/backups.sh create"

      - name: Deploy to DigitalOcean
        run: doctl compute ssh staging-manager-1 --ssh-command "cd timelines && VERSION=${{ needs.check-commits.outputs.version }} ./scripts/stack-update.sh"

      - name: Run migrations
        run: doctl compute ssh staging-manager-1 --ssh-command "cd timelines && ./scripts/stack-migrate.sh"

      - name: Update deployment status
        run: |
          echo "### Staging Deployment 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.check-commits.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [check-commits, prepare-containers]
    if: ${{ github.ref_name == 'main' }}
    environment:
      name: production
      url: https://timelines.tenebrie.com/

    steps:
      - uses: actions/checkout@v7

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $(doctl compute droplet get prod-manager-1 --format PublicIPv4 --no-header) >> ~/.ssh/known_hosts

      - name: Checkout branch
        run: doctl compute ssh prod-manager-1 --ssh-command "cd timelines && git fetch && git checkout main && git pull"

      - name: Backup Database (Backrest)
        run: doctl compute ssh prod-manager-1 --ssh-command "cd timelines && ./scripts/backups.sh create"

      - name: Deploy to DigitalOcean
        run: doctl compute ssh prod-manager-1 --ssh-command "cd timelines && VERSION=${{ needs.check-commits.outputs.version }} ./scripts/stack-update.sh"

      - name: Run migrations
        run: doctl compute ssh prod-manager-1 --ssh-command "cd timelines && ./scripts/stack-migrate.sh"

      - name: Update deployment status
        run: |
          echo "### Production Deployment 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.check-commits.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  promote-release:
    name: Promote Release
    runs-on: ubuntu-latest
    needs: [check-commits, deploy-production]
    if: ${{ github.ref_name == 'main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check-commits.outputs.version }}" --prerelease=false --latest
