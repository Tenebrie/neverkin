name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore: [main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [Styx, Rhea, Calliope, Orpheus, Library]
    env:
      SCRIPT: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Set script name
        run: echo "SCRIPT=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build:library
      - name: Build ${{ matrix.service }}
        run: npm run build:$SCRIPT
      - name: Run ${{ matrix.service }} tests
        run: npm run test:$SCRIPT
      - name: Lint ${{ matrix.service }}
        run: npm run lint:$SCRIPT

  run-e2e:
    name: Playwright (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium
            browser: chromium
          - name: Firefox
            browser: firefox
    env:
      COMPOSE_BAKE: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Start services
        run: |
          docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for migrations to complete..."
          docker compose -f docker-compose.ci.yml logs -f rhea-migrate &
          timeout 120 bash -c 'while docker compose -f docker-compose.ci.yml ps rhea-migrate --status running | grep -q rhea-migrate; do sleep 2; done'

          echo "Waiting for Rhea to be healthy..."
          timeout 60 bash -c 'until docker compose -f docker-compose.ci.yml exec -T rhea curl -sf http://localhost:3000/health; do sleep 2; done'
          echo "Services are ready!"

      - name: Build Playwright container
        working-directory: test/e2e
        run: docker build -t playwright-e2e .

      - name: Run E2E tests
        working-directory: test/e2e
        run: |
          docker run --rm \
            --network neverkin-playwright \
            -e TARGET_ENV=ci \
            -v $(pwd)/test-report:/app/test-report \
            playwright-e2e \
            npx playwright test --config=playwright.ci.config.ts --project=${{ matrix.browser }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: test/e2e/test-report/

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  run-e2e-echo:
    name: Playwright (Echo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        working-directory: app/echo-desktop
        run: npm run build

      - name: Start desktop app
        working-directory: app/echo-desktop/dist/package/neverkin-desktop-linux-x64
        run: |
          export NEVERKIN_DESKTOP_DATA="$RUNNER_TEMP/echo-data"
          export NEVERKIN_DESKTOP_PORT=8190
          xvfb-run -a ./neverkin --no-sandbox &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8190/health; do sleep 1; done'

      - name: Build Playwright container
        working-directory: test/e2e
        run: docker build -t playwright-e2e .

      - name: Run E2E tests
        working-directory: test/e2e
        run: |
          docker run --rm \
            --network host \
            -e TARGET_ENV=desktop \
            -v $(pwd)/test-report:/app/test-report \
            playwright-e2e \
            npx playwright test --config=playwright.ci.config.ts --project=chromium

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-echo
          path: test/e2e/test-report/
